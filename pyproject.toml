[project]
name = "crowdfm"
version = "1.0.0"
description = "CrowdFM: Towards a Foundation Model for Crowdsourced Label Aggregation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "tensorboard==2.20.0",
    "pandas>=2.2.3",
    "torch>=2.6.0",
    "tqdm>=4.66",
]

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ty.rules]
possibly-unresolved-reference = "ignore"
unresolved-attribute = "ignore"
